<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Digital Skill-Badge Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #b45309;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent 40%),
                radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 2rem auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.8);
            display: none;
        }

        .result-box.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .badge-preview {
            text-align: center;
            margin-top: 1rem;
        }

        .badge-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .tier-Gold {
            color: var(--gold);
        }

        .tier-Silver {
            color: var(--silver);
        }

        .tier-Bronze {
            color: var(--bronze);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Verified Digital Skill-Badge Portal</h1>
            <p class="subtitle">Micro-credentialing and Verifiable Digital Credentials for 2026</p>
        </header>

        <div class="grid">
            <!-- Verify Badge Card -->
            <div class="card">
                <h2>🔍 Verify a Badge</h2>
                <div class="form-group">
                    <label for="verify-code">Enter Verification Code</label>
                    <input type="text" id="verify-code" placeholder="e.g. 5WMSWF7UU9">
                </div>
                <div class="form-group">
                    <label for="verify-engine">Select Engine (Load Test Comparison)</label>
                    <select id="verify-engine">
                        <option value="servlet">Java Servlet</option>
                        <option value="cgi">Python CGI</option>
                    </select>
                </div>
                <button onclick="verifyBadge()">Verify Credential</button>

                <div id="verify-result" class="result-box"></div>
            </div>

            <!-- Issue Badge Card -->
            <div class="card">
                <h2>🎓 Issue a Badge</h2>
                <div class="form-group">
                    <label for="issue-student">Student ID</label>
                    <input type="number" id="issue-student" placeholder="1">
                </div>
                <div class="form-group">
                    <label for="issue-module">Module ID</label>
                    <input type="number" id="issue-module" placeholder="1">
                </div>
                <div class="form-group">
                    <label for="issue-score">Score (0-100) - Determines Tier</label>
                    <input type="number" id="issue-score" placeholder="95">
                </div>
                <button onclick="issueBadge()">Generate Credential</button>

                <div id="issue-result" class="result-box"></div>
            </div>

            <!-- Third-Party Verification Card -->
            <div class="card">
                <h2>🌐 Third-Party Verification</h2>
                <div class="form-group">
                    <label for="tp-platform">Select Platform</label>
                    <select id="tp-platform">
                        <option value="ibm">IBM SkillsBuild</option>
                        <option value="coursera">Coursera</option>
                        <option value="edx">edX</option>
                        <option value="linkedin">LinkedIn Learning</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tp-code">Certificate ID / Code</label>
                    <input type="text" id="tp-code" placeholder="e.g. 8XYZ-9ABC-DEF0">
                </div>
                <button onclick="verifyThirdParty()">Verify External Badge</button>
                <div id="tp-result" class="result-box"></div>
            </div>

            <!-- CGI vs Servlet Load Testing Card -->
            <div class="card">
                <h2>⚡ CGI vs Servlet Benchmark</h2>
                <div class="form-group">
                    <label for="load-requests">Number of Requests (n)</label>
                    <input type="number" id="load-requests" placeholder="50" value="10">
                </div>
                <div class="form-group">
                    <label for="load-code">Verification Code to Test</label>
                    <input type="text" id="load-code" placeholder="e.g. 5WMSWF7UU9">
                </div>
                <button onclick="runLoadTest()">Run Benchmark</button>
                <div id="load-result" class="result-box"
                    style="margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.4);">
                    <p style="margin:0; color: var(--text-muted)">Results will appear here...</p>
                </div>
            </div>
            <!-- Student Wallet Card -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>💳 Student Wallet Lookup</h2>
                <div class="form-group">
                    <label for="wallet-student">Enter Student ID to view all earned badges</label>
                    <input type="number" id="wallet-student" placeholder="1">
                </div>
                <button onclick="lookupWallet()">View Wallet</button>

                <div id="wallet-result" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        // Stub functions - will be connected to actual API endpoints
        async function verifyBadge() {
            const code = document.getElementById('verify-code').value;
            const engine = document.getElementById('verify-engine').value;
            const resultBox = document.getElementById('verify-result');

            if (!code) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Please enter a code.</span>';
                resultBox.classList.add('active');
                return;
            }

            resultBox.innerHTML = 'Verifying...';
            resultBox.classList.add('active');

            try {
                const endpoint = engine === 'cgi' ? '/cgi-bin/verify.py' : 'http://localhost:8080/skill-badge/verify';
                const res = await fetch(`${endpoint}?code=${code}`);
                const data = await res.json();

                if (data.status === 'VALID') {
                    const d = data.data;
                    resultBox.innerHTML = `
                        <div class="badge-preview">
                            <div class="badge-icon tier-${d.tier}">🏆</div>
                            <h3 style="margin: 0; color: var(--success)">✅ Authentic Credential</h3>
                            <p style="margin: 0.5rem 0; font-weight: bold;">${d.student_name}</p>
                            <p style="margin: 0; color: var(--text-muted)">Completed: ${d.module_title}</p>
                            <p style="margin: 0.5rem 0;">Tier: <strong class="tier-${d.tier}">${d.tier}</strong> (Score: ${d.score})</p>
                            <p style="font-size: 0.8rem; color: var(--text-muted)">Issued: ${d.issued_at} via ${data.engine}</p>
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `<h3 style="margin:0; color: #ef4444;">❌ Invalid or Tampered</h3><p>${data.message}</p>`;
                }
            } catch (e) {
                resultBox.innerHTML = `<span style="color: #ef4444;">Connection Error. Is the ${engine} server running?</span>`;
            }
        }

        async function issueBadge() {
            const studentId = document.getElementById('issue-student').value;
            const moduleId = document.getElementById('issue-module').value;
            const score = document.getElementById('issue-score').value;
            const resultBox = document.getElementById('issue-result');

            resultBox.innerHTML = 'Issuing...';
            resultBox.classList.add('active');

            try {
                // Connects to the Servlet Issuance API
                const res = await fetch('/skill-badge/issue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `student_id=${studentId}&module_id=${moduleId}&score=${score}`
                });
                const data = await res.json();

                if (data.status === 'SUCCESS') {
                    resultBox.innerHTML = `
                        <p style="color: var(--success); margin: 0 0 0.5rem 0;">✅ Badge Issued Successfully!</p>
                        <p style="margin: 0; font-size: 0.9rem;">Verification Code:</p>
                        <code style="display: block; background: #000; padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem; word-break: break-all;">
                            ${data.verification_code}
                        </code>
                    `;
                } else {
                    resultBox.innerHTML = `<span style="color: #ef4444;">Error: ${data.message}</span>`;
                }
            } catch (e) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Connection Error. Is Tomcat running?</span>';
            }
        }

        async function lookupWallet() {
            const studentId = document.getElementById('wallet-student').value;
            const resultBox = document.getElementById('wallet-result');

            resultBox.innerHTML = 'Fetching wallet...';
            resultBox.classList.add('active');

            try {
                const res = await fetch(`http://localhost:8080/skill-badge/wallet?student_id=${studentId}`);
                const data = await res.json();

                if (data.status === 'SUCCESS' && data.badges.length > 0) {
                    let html = `<h3 style="margin-top:0;">Wallet for ${data.student_name}</h3><ul style="list-style: none; padding: 0;">`;
                    data.badges.forEach(b => {
                        html += `
                            <li style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; border-left: 4px solid var(--${b.tier.toLowerCase()});">
                                <strong style="display: block; font-size: 1.1rem;">${b.module_title}</strong>
                                <span class="tier-${b.tier}">${b.tier}</span> (${b.score}%)<br>
                                <code style="color: var(--text-muted); font-size: 0.85rem;">Code: ${b.verification_code}</code>
                            </li>
                        `;
                    });
                    html += '</ul>';
                    resultBox.innerHTML = html;
                } else if (data.status === 'SUCCESS') {
                    resultBox.innerHTML = `<p>No badges earned yet.</p>`;
                } else {
                    resultBox.innerHTML = `<span style="color: #ef4444;">Error: ${data.message}</span>`;
                }
            } catch (e) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Connection Error. Is Tomcat running?</span>';
            }
        }

        async function verifyThirdParty() {
            const platform = document.getElementById('tp-platform').value;
            const platformName = document.getElementById('tp-platform').options[document.getElementById('tp-platform').selectedIndex].text;
            const code = document.getElementById('tp-code').value;
            const resultBox = document.getElementById('tp-result');

            if (!code) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Please enter a certificate code.</span>';
                resultBox.classList.add('active');
                return;
            }

            resultBox.innerHTML = 'Connecting to ' + platformName + ' API...';
            resultBox.classList.add('active');

            // Simulating an external API call delay
            setTimeout(() => {
                const isValid = code.length > 5; // dummy logic
                if (isValid) {
                    resultBox.innerHTML = `
                        <div class="badge-preview">
                            <div class="badge-icon">🌟</div>
                            <h3 style="margin: 0; color: var(--success)">✅ Verified External Credential</h3>
                            <p style="margin: 0.5rem 0; font-weight: bold;">Provider: ${platformName}</p>
                            <code style="color: var(--text-muted); font-size: 0.85rem;">Cert ID: ${code}</code>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">Verified via Open Badges API</p>
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `<h3 style="margin:0; color: #ef4444;">❌ Invalid Credential</h3><p>Could not verify this code with ${platformName}.</p>`;
                }
            }, 1200);
        }

        async function runLoadTest() {
            const n = parseInt(document.getElementById('load-requests').value) || 10;
            const code = document.getElementById('load-code').value;
            const resultBox = document.getElementById('load-result');

            if (!code) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Please provide a verification code to test.</span>';
                return;
            }
            if (n <= 0 || n > 1000) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Please enter a valid number of requests (1-1000).</span>';
                return;
            }

            resultBox.innerHTML = `<p style="margin:0; color: var(--gold);">⏳ Running benchmark for ${n} requests. Please wait...</p>`;

            // Function to perform n requests and calculate total time
            const runTest = async (endpoint) => {
                const start = performance.now();
                const promises = [];
                for (let i = 0; i < n; i++) {
                    promises.push(fetch(`${endpoint}?code=${code}`).catch(e => null));
                }
                await Promise.all(promises);
                const end = performance.now();
                return end - start;
            };

            try {
                // Test Servlet
                const servletTime = await runTest('http://localhost:8080/skill-badge/verify');

                // Test CGI
                const cgiTime = await runTest('/cgi-bin/verify.py');

                const fasterBy = cgiTime > 0 ? (cgiTime / servletTime).toFixed(2) : 0;

                resultBox.innerHTML = `
                    <h3 style="margin-top: 0; margin-bottom: 1rem;">📊 Benchmark Results</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                        <span><strong>Java Servlet Container:</strong></span>
                        <span style="color: var(--success); font-weight: bold;">${servletTime.toFixed(2)} ms</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span><strong>Python CGI (Process per req):</strong></span>
                        <span style="color: var(--bronze); font-weight: bold;">${cgiTime.toFixed(2)} ms</span>
                    </div>
                    <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">
                        <em>Servlet was approximately <strong>${fasterBy}x</strong> faster than CGI.</em>
                    </p>
                `;
            } catch (e) {
                resultBox.innerHTML = '<span style="color: #ef4444;">Benchmark failed. Are both servers running?</span>';
            }
        }
    </script>
</body>

</html>
